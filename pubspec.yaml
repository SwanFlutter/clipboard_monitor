name: clipboard_monitor
description: "Watch the system clipboard for text changes on Windows, macOS and Linux, with download-link detection and a write loop guard."
version: 0.1.0
homepage:

environment:
  sdk: ^3.13.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        dartPluginClass: ClipboardMonitorRegistrar
      macos:
        dartPluginClass: ClipboardMonitorRegistrar
      windows:
        pluginClass: ClipboardMonitorPluginCApi
